<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Prism host</title>
<style>
  /* #status sets `display`, which would otherwise beat the UA rule for [hidden]. */
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: #08090d; color: #7d879c;
    font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #stage { position: absolute; inset: 0; }
  .game { border: 0; width: 100%; height: 100%; display: block; background: #08090d; }
  #status { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; padding: 24px; }
</style>
</head>
<body>
  <div id="stage"></div>
  <p id="status">This page is the Prism game host. Open it from the Prism launcher extension.</p>
  <script src="host.js"></script>
</body>
</html>
