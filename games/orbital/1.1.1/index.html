<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orbital</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="stage"></canvas>
  <header class="bar">
    <div class="title"><strong id="level-name">—</strong><span id="level-index"></span></div>
    <div class="spacer"></div>
    <span class="stat"><b id="attempts">0</b> launches</span>
    <button id="retry" class="ghost" type="button">Retry</button>
    <button id="levels-button" class="ghost" type="button">Levels</button>
  </header>
  <div class="power"><i id="power-fill"></i></div>
  <p class="hint" id="hint"></p>

  <div class="sheet" id="sheet" hidden>
    <h2>Launches</h2>
    <div class="level-grid" id="level-grid"></div>
    <button id="sheet-close" class="ghost" type="button">Close</button>
  </div>

  <div class="banner" id="banner" hidden>
    <h1 id="banner-title"></h1>
    <p id="banner-text"></p>
    <button id="banner-action" type="button">Next</button>
  </div>

  <script src="prism-sdk.js"></script>
  <script src="main.js"></script>
</body>
</html>
