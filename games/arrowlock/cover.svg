<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#06070c"/>
    </linearGradient>
    <pattern id="cells" width="46" height="46" patternUnits="userSpaceOnUse" patternTransform="translate(26 20)">
      <rect x="7" y="7" width="32" height="32" rx="7" fill="#94a3b8" fill-opacity="0.05"/>
    </pattern>
    <!-- One arrow, drawn once and pointed by a rotation, exactly as the game does it. -->
    <path id="a" d="M16 0 -1 14 -1 6 -16 6 -16 -6 -1 -6 -1 -14Z"/>
    <linearGradient id="trail" gradientUnits="userSpaceOnUse" x1="296" y1="0" x2="432" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="wallclip"><rect x="213" y="161" width="40" height="40" rx="8"/></clipPath>
  </defs>

  <rect width="480" height="270" fill="url(#bg)"/>
  <rect x="18" y="12" width="338" height="246" rx="18" fill="#0a0d15" stroke="#94a3b8" stroke-opacity="0.1"/>
  <rect x="26" y="20" width="322" height="230" fill="url(#cells)"/>

  <!-- tiles, then glyphs: sky up, violet right, amber down, emerald left -->
  <g stroke-width="1.4">
    <g fill="#38bdf8" fill-opacity="0.17" stroke="#38bdf8" stroke-opacity="0.55">
      <rect x="167" y="23" width="40" height="40" rx="11"/>
      <rect x="75" y="69" width="40" height="40" rx="11"/>
      <rect x="259" y="69" width="40" height="40" rx="11"/>
      <rect x="259" y="115" width="40" height="40" rx="11"/>
      <rect x="167" y="207" width="40" height="40" rx="11"/>
      <rect x="305" y="207" width="40" height="40" rx="11"/>
    </g>
    <g fill="#a78bfa" fill-opacity="0.17" stroke="#a78bfa" stroke-opacity="0.55">
      <rect x="75" y="23" width="40" height="40" rx="11"/>
      <rect x="121" y="161" width="40" height="40" rx="11"/>
      <rect x="29" y="115" width="40" height="86" rx="11"/>
    </g>
    <g fill="#fb923c" fill-opacity="0.17" stroke="#fb923c" stroke-opacity="0.55">
      <rect x="29" y="23" width="40" height="40" rx="11"/>
      <rect x="213" y="69" width="40" height="40" rx="11"/>
      <rect x="213" y="207" width="40" height="40" rx="11"/>
    </g>
    <g fill="#34d399" fill-opacity="0.17" stroke="#34d399" stroke-opacity="0.55">
      <rect x="259" y="23" width="40" height="40" rx="11"/>
      <rect x="167" y="115" width="40" height="40" rx="11"/>
      <rect x="305" y="161" width="40" height="40" rx="11"/>
    </g>
  </g>

  <g fill="#38bdf8">
    <use href="#a" transform="translate(187 43) rotate(-90)"/>
    <use href="#a" transform="translate(95 89) rotate(-90)"/>
    <use href="#a" transform="translate(279 89) rotate(-90)"/>
    <use href="#a" transform="translate(279 135) rotate(-90)"/>
    <use href="#a" transform="translate(187 227) rotate(-90)"/>
    <use href="#a" transform="translate(325 227) rotate(-90)"/>
  </g>
  <g fill="#a78bfa">
    <use href="#a" transform="translate(95 43)"/>
    <use href="#a" transform="translate(141 181)"/>
    <!-- the wide one: one arrow, two lanes to keep clear -->
    <path d="M63.4 158 46.8 183.8V169.2H34.6v-22.4h12.2V132.2Z"/>
  </g>
  <g fill="#fb923c">
    <use href="#a" transform="translate(49 43) rotate(90)"/>
    <use href="#a" transform="translate(233 89) rotate(90)"/>
    <use href="#a" transform="translate(233 227) rotate(90)"/>
  </g>
  <g fill="#34d399">
    <use href="#a" transform="translate(279 43) rotate(180)"/>
    <use href="#a" transform="translate(187 135) rotate(180)"/>
    <use href="#a" transform="translate(325 181) rotate(180)"/>
  </g>

  <!-- a wall: it never moves, and it never reads as an empty cell -->
  <rect x="213" y="161" width="40" height="40" rx="8" fill="#161a26" stroke="#94a3b8" stroke-opacity="0.18"/>
  <g clip-path="url(#wallclip)" stroke="#94a3b8" stroke-opacity="0.17" stroke-width="4">
    <path d="M203 205 239 157M217 209 253 161M231 213 267 165"/>
  </g>

  <!-- and one already gone, which is the whole game -->
  <g>
    <path d="M300 135h108" stroke="url(#trail)" stroke-width="14" stroke-linecap="round" opacity="0.45"/>
    <path d="M336 152h72" stroke="url(#trail)" stroke-width="5" stroke-linecap="round" opacity="0.3"/>
    <path d="M336 118h72" stroke="url(#trail)" stroke-width="5" stroke-linecap="round" opacity="0.3"/>
    <g filter="url(#glow)">
      <rect x="419" y="115" width="40" height="40" rx="11" fill="#a78bfa" fill-opacity="0.22"
            stroke="#a78bfa" stroke-opacity="0.85" stroke-width="1.6"/>
      <use href="#a" transform="translate(439 135)" fill="#c4b5fd"/>
    </g>
  </g>
</svg>
