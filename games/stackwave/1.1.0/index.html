<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stackwave</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="stage"></canvas>
  <header class="hud">
    <span id="height">0</span>
    <span id="best">best 0</span>
  </header>
  <div class="combo" id="combo" hidden>Perfect</div>
  <div class="overlay" id="overlay">
    <h1 id="overlay-title">Stackwave</h1>
    <p id="overlay-text">Tap, click or press space to drop the slab. Overhang gets cut away.</p>
    <button id="start" type="button">Start stacking</button>
  </div>
  <script src="prism-sdk.js"></script>
  <script src="main.js"></script>
</body>
</html>
