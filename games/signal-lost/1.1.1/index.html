<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Signal Lost</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="stage"></canvas>
  <header class="hud">
    <span id="depth">Level 1</span>
    <span id="lives" class="lives"></span>
    <span id="charge" class="charge"><i id="charge-fill"></i></span>
  </header>
  <div class="overlay" id="overlay">
    <h1 id="overlay-title">Signal Lost</h1>
    <p id="overlay-text">Space sends a ping. It shows you the walls — and shows them you.</p>
    <button id="start" type="button">Descend</button>
  </div>
  <script src="prism-sdk.js"></script>
  <script src="main.js"></script>
</body>
</html>
