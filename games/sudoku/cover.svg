<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#06070c"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="0.55" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="480" height="270" fill="url(#bg)"/>

  <!-- the grid, sitting slightly right of centre so the title has room -->
  <g transform="translate(242 27)">
    <rect x="-4" y="-4" width="224" height="224" rx="10" fill="#0d1018" stroke="#39415a" stroke-width="2"/>
    <g stroke="#232a3a" stroke-width="1">
      <path d="M24 0V216M48 0V216M96 0V216M120 0V216M168 0V216M192 0V216"/>
      <path d="M0 24H216M0 48H216M0 96H216M0 120H216M0 168H216M0 192H216"/>
    </g>
    <g stroke="#4c556e" stroke-width="2">
      <path d="M72 0V216M144 0V216M0 72H216M0 144H216"/>
    </g>

    <!-- the selected square, and every other seven lit with it -->
    <rect x="97" y="49" width="22" height="22" fill="#1d3f5c"/>
    <rect x="96" y="48" width="24" height="24" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <g fill="#17324a">
      <rect x="24" y="120" width="24" height="24"/>
      <rect x="168" y="168" width="24" height="24"/>
      <rect x="144" y="0" width="24" height="24"/>
    </g>

    <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" text-anchor="middle">
      <g fill="#e7ebf3" font-weight="600">
        <text x="12" y="18">5</text><text x="60" y="18">3</text><text x="204" y="18">1</text>
        <text x="36" y="66">6</text><text x="132" y="66">9</text><text x="180" y="66">4</text>
        <text x="84" y="114">8</text><text x="156" y="114">2</text>
        <text x="12" y="162">4</text><text x="108" y="162">6</text><text x="204" y="162">3</text>
        <text x="60" y="210">2</text><text x="132" y="210">8</text>
      </g>
      <g fill="#bae6fd" font-weight="600">
        <text x="156" y="18">7</text><text x="36" y="138">7</text><text x="180" y="186">7</text>
      </g>
      <text x="108" y="66" fill="#7dd3fc" font-weight="600">7</text>
    </g>

    <!-- pencil marks: the ones you have not decided between -->
    <g fill="#5b667f" font-family="system-ui, sans-serif" font-size="7" text-anchor="middle">
      <text x="76" y="128">1</text><text x="84" y="128">3</text>
      <text x="76" y="138">5</text><text x="92" y="138">8</text>
      <text x="172" y="80">2</text><text x="188" y="80">4</text><text x="180" y="90">9</text>
    </g>
  </g>

  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="34" y="120" font-size="46" font-weight="650" letter-spacing="-1.5" fill="url(#ink)" filter="url(#glow)">Sudoku</text>
    <text x="36" y="150" font-size="13.5" fill="#8b95ad">One of each, nine ways over.</text>
    <text x="36" y="182" font-size="11.5" fill="#5b667f" letter-spacing="1.6">NEVER NEEDS A GUESS</text>
  </g>

  <g transform="translate(36 200)" font-family="system-ui, sans-serif" font-size="10.5" fill="#66708a" letter-spacing="0.6">
    <rect x="0" y="0" width="52" height="21" rx="6" fill="#141926" stroke="#2a3247"/>
    <text x="26" y="14.5" text-anchor="middle">EASY</text>
    <rect x="58" y="0" width="62" height="21" rx="6" fill="rgba(56,189,248,0.12)" stroke="#38bdf8"/>
    <text x="89" y="14.5" text-anchor="middle" fill="#e7ebf3">MEDIUM</text>
    <rect x="126" y="0" width="52" height="21" rx="6" fill="#141926" stroke="#2a3247"/>
    <text x="152" y="14.5" text-anchor="middle">HARD</text>
  </g>
</svg>
