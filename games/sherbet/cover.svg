<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#fff7ec"/>
      <stop offset="1" stop-color="#ffe2c9"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#ff8a2b"/>
      <stop offset="0.5" stop-color="#ff3d6e"/>
      <stop offset="1" stop-color="#b16cf0"/>
    </linearGradient>
    <clipPath id="tray">
      <rect x="252" y="33" width="204" height="204" rx="18"/>
    </clipPath>

    <g id="s-circle"><circle r="19"/></g>
    <g id="s-square"><rect x="-17" y="-17" width="34" height="34" rx="6"/></g>
    <g id="s-triangle"><path d="M0-20 18 14-18 14Z"/></g>
    <g id="s-diamond"><path d="M0-20 20 0 0 20-20 0Z"/></g>
    <g id="s-hexagon"><path d="M17.3 10 0 20-17.3 10-17.3-10 0-20 17.3-10Z"/></g>
    <g id="s-star">
      <path d="M0-21 5.5-7.5 20-6.5 8.8 2.9 12.3 17 0 9.3-12.3 17-8.8 2.9-20-6.5-5.5-7.5Z"/>
    </g>
  </defs>

  <rect width="480" height="270" fill="url(#paper)"/>

  <rect x="252" y="33" width="204" height="204" rx="18" fill="#fffaf3"/>
  <g clip-path="url(#tray)" fill="#ffd8b4" fill-opacity="0.5">
    <rect x="252" y="33" width="51" height="51"/><rect x="354" y="33" width="51" height="51"/>
    <rect x="303" y="84" width="51" height="51"/><rect x="405" y="84" width="51" height="51"/>
    <rect x="252" y="135" width="51" height="51"/><rect x="354" y="135" width="51" height="51"/>
    <rect x="303" y="186" width="51" height="51"/><rect x="405" y="186" width="51" height="51"/>
  </g>

  <g stroke-linejoin="round" stroke-width="7">
    <use href="#s-circle"   x="277.5" y="58.5"  fill="#ff3d6e" stroke="#c3164c"/>
    <use href="#s-square"   x="328.5" y="58.5"  fill="#ff8a2b" stroke="#c25a00"/>
    <use href="#s-triangle" x="379.5" y="58.5"  fill="#ffcf2e" stroke="#bd8f00"/>
    <use href="#s-diamond"  x="430.5" y="58.5"  fill="#43cf6b" stroke="#1a8c42"/>

    <use href="#s-hexagon"  x="277.5" y="109.5" fill="#3d8bff" stroke="#1655c0"/>
    <use href="#s-star"     x="328.5" y="109.5" fill="#b16cf0" stroke="#7735c2"/>
    <use href="#s-diamond"  x="379.5" y="109.5" fill="#43cf6b" stroke="#1a8c42"/>
    <use href="#s-triangle" x="430.5" y="109.5" fill="#ffcf2e" stroke="#bd8f00"/>

    <!-- the row about to go -->
    <use href="#s-circle"   x="277.5" y="160.5" fill="#ff3d6e" stroke="#c3164c"/>
    <use href="#s-circle"   x="328.5" y="160.5" fill="#ff3d6e" stroke="#c3164c"/>
    <use href="#s-circle"   x="379.5" y="160.5" fill="#ff3d6e" stroke="#c3164c"/>
    <use href="#s-hexagon"  x="430.5" y="160.5" fill="#3d8bff" stroke="#1655c0"/>

    <use href="#s-star"     x="277.5" y="211.5" fill="#b16cf0" stroke="#7735c2"/>
    <use href="#s-square"   x="328.5" y="211.5" fill="#ff8a2b" stroke="#c25a00"/>
    <use href="#s-diamond"  x="379.5" y="211.5" fill="#43cf6b" stroke="#1a8c42"/>
    <use href="#s-circle"   x="430.5" y="211.5" fill="#4b3a63" stroke="#291d3c"/>
  </g>

  <!-- a striped sweet: the bands run the way it fires -->
  <g fill="#fff" fill-opacity="0.92">
    <rect x="416" y="150" width="29" height="5" rx="2.5"/>
    <rect x="416" y="158" width="29" height="5" rx="2.5"/>
    <rect x="416" y="166" width="29" height="5" rx="2.5"/>
  </g>

  <!-- and a bomb, which belongs to no colour and takes any of them -->
  <g>
    <circle cx="430.5" cy="202" r="3.6" fill="#ff3d6e"/>
    <circle cx="438.8" cy="206.8" r="3.6" fill="#ff8a2b"/>
    <circle cx="438.8" cy="216.2" r="3.6" fill="#ffcf2e"/>
    <circle cx="430.5" cy="221" r="3.6" fill="#43cf6b"/>
    <circle cx="422.2" cy="216.2" r="3.6" fill="#3d8bff"/>
    <circle cx="422.2" cy="206.8" r="3.6" fill="#b16cf0"/>
  </g>

  <rect x="307" y="139" width="43" height="43" rx="13" fill="none" stroke="#b16cf0" stroke-width="3.5"/>

  <text x="34" y="126" font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="47" font-weight="750" letter-spacing="-1.6" fill="url(#ink)">Sherbet</text>
  <text x="35" y="155" font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="15" font-weight="500" fill="#8a6b81">Sixty levels of match three,</text>
  <text x="35" y="175" font-family="system-ui, -apple-system, Segoe UI, sans-serif"
        font-size="15" font-weight="500" fill="#8a6b81">and the drops that follow.</text>

  <g opacity="0.5">
    <circle cx="58" cy="42" r="8" fill="#ffcf2e"/>
    <circle cx="92" cy="66" r="5" fill="#ff3d6e"/>
    <circle cx="196" cy="38" r="6" fill="#43cf6b"/>
    <circle cx="164" cy="72" r="4" fill="#3d8bff"/>
    <circle cx="62" cy="216" r="7" fill="#3d8bff"/>
    <circle cx="104" cy="238" r="4.5" fill="#b16cf0"/>
    <circle cx="196" cy="214" r="5.5" fill="#ff8a2b"/>
    <circle cx="152" cy="242" r="4" fill="#43cf6b"/>
  </g>
</svg>
