<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1424"/><stop offset="1" stop-color="#06070c"/>
    </linearGradient>
    <filter id="drop" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <!-- One 45x45 box per piece, the same proportions the game draws on canvas. -->
    <g id="king">
      <path d="M21.2 4.2h2.6v4h3.8v2.6h-3.8v3.6h-2.6v-3.6h-3.8V8.2h3.8z"/>
      <path d="M22.5 15.6c4-4 11.5-2.2 11.5 4 0 3.8-5.2 6-11.5 8.8-6.3-2.8-11.5-5-11.5-8.8 0-6.2 7.5-8 11.5-4z"/>
      <path d="M11 27h23l-1.5 4.5h-20z"/>
      <path d="M9 31h27l2 6.5H7z"/>
    </g>
    <g id="queen">
      <path d="M7.5 12l4 14.5h22L37.5 12l-6 8-2-9.5-3.5 9.5-3.5-11-3.5 11L15.5 10.5 13.5 20z"/>
      <circle cx="7.5" cy="12" r="2.4"/><circle cx="15.5" cy="10.5" r="2.4"/>
      <circle cx="22.5" cy="9" r="2.4"/><circle cx="29.5" cy="10.5" r="2.4"/>
      <circle cx="37.5" cy="12" r="2.4"/>
      <path d="M11 27h23l-1.5 4.5h-20z"/>
      <path d="M9 31h27l2 6.5H7z"/>
    </g>
    <g id="knight">
      <path d="M21.5 9.5c8.5 1 14 7 14 15.5v6.5h-22v-2c0-4 5.5-5.5 8.5-8.5 1.6-1.6 2-3.4 1.4-5-1.8 3-5 5-7.8 5-3.2 0-5.2-1.6-5-3.6.2-1.6 1.4-2.4 2.4-3 .4-1.6-.1-3 .9-4 1.5-2 4.3-2.4 6.1-1.4z"/>
      <path d="M9.5 31h25l2 6.5h-29z"/>
    </g>
    <g id="rook">
      <path d="M11 10.5h4.2v3.3h5.2v-3.3h4.2v3.3h5.2v-3.3H34V18l-3.4 3v7.5l3.4 3H11l3.4-3V21z"/>
      <path d="M9.5 31h25l2 6.5h-29z"/>
    </g>
    <g id="pawn">
      <circle cx="22.5" cy="13.5" r="4.7"/>
      <path d="M15.5 29.5c0-5.5 3.9-7.1 3.9-9.9h6.2c0 2.8 3.9 4.4 3.9 9.9z"/>
      <path d="M11 31h23l2 6.5H9z"/>
    </g>
  </defs>

  <rect width="480" height="270" fill="url(#bg)"/>

  <!-- A five-square-wide crop of the board, big enough for the pieces to read -->
  <g transform="translate(20 15)">
    <rect width="240" height="240" fill="#4a5570"/>
    <g fill="#8d9bb5">
      <path d="M48 0h48v48H48zM144 0h48v48h-48z"/>
      <path d="M0 48h48v48H0zM96 48h48v48H96zM192 48h48v48h-48z"/>
      <path d="M48 96h48v48H48zM144 96h48v48h-48z"/>
      <path d="M0 144h48v48H0zM96 144h48v48H96zM192 144h48v48h-48z"/>
      <path d="M48 192h48v48H48zM144 192h48v48h-48z"/>
    </g>

    <!-- the move the engine is looking at -->
    <rect x="96" y="192" width="48" height="48" fill="#38bdf8" fill-opacity="0.32"/>
    <rect x="144" y="96" width="48" height="48" fill="#38bdf8" fill-opacity="0.32"/>
    <circle cx="72" cy="72" r="7.5" fill="#38bdf8" fill-opacity="0.7"/>
    <circle cx="72" cy="168" r="7.5" fill="#38bdf8" fill-opacity="0.7"/>

    <g filter="url(#drop)" stroke-linejoin="round" stroke-width="1.4">
      <g fill="#f4f6fb" stroke="#232a3a">
        <use href="#knight" transform="translate(145.5 97.5)"/>
        <use href="#rook" transform="translate(97.5 145.5)"/>
        <use href="#pawn" transform="translate(1.5 193.5)"/>
      </g>
      <g fill="#20263a" stroke="#c3ccdf">
        <use href="#king" transform="translate(49.5 1.5)"/>
        <use href="#pawn" transform="translate(145.5 1.5)"/>
        <use href="#queen" transform="translate(193.5 49.5)"/>
      </g>
    </g>
  </g>

  <g font-family="system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="284" y="98" fill="#e7ebf3" font-size="40" font-weight="620" letter-spacing="-1">Chess</text>
    <text x="285" y="122" fill="#7d879c" font-size="12.5">All the rules, four strengths.</text>
    <g transform="translate(285 140)">
      <rect width="164" height="26" rx="9" fill="#141722" stroke="#94a3b8" stroke-opacity="0.16"/>
      <text x="30" y="17" fill="#7d879c" font-size="10.5" text-anchor="middle">Casual</text>
      <text x="71" y="17" fill="#7d879c" font-size="10.5" text-anchor="middle">Sharp</text>
      <rect x="97" y="4" width="63" height="18" rx="6" fill="#22d3ee"/>
      <text x="128.5" y="17" fill="#06070c" font-size="10.5" font-weight="620" text-anchor="middle">Brutal</text>
    </g>
    <g fill="#5b6379" font-size="11.5" letter-spacing="0.3">
      <text x="285" y="196">1. e4 e5    2. Nf3 Nc6</text>
      <text x="285" y="214">3. Bb5 a6   4. Ba4 Nf6</text>
      <text x="285" y="232" fill="#38bdf8" fill-opacity="0.85">5. O-O Nxe4</text>
    </g>
  </g>
</svg>
